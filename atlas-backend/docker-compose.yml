version: '3.8'

services:
  db:
    image: postgres:15
    container_name: atlas-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: atlas_db
    ports:
      - "5433:5432"
    volumes:
      - atlas-db-data:/var/lib/postgresql/data

volumes:
  atlas-db-data:
